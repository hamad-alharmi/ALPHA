[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-foundation"
version = "0.2.0"
description = "Project ALPHA foundation and local Companion link"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
alpha-core = "alpha_core.__main__:main"
alpha-companion = "alpha_companion.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
