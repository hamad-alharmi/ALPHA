[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-foundation"
version = "0.1.0"
description = "Project ALPHA Phase 1 foundation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
alpha-core = "alpha_core.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
